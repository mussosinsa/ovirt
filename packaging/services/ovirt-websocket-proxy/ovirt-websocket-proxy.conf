# Please do not edit this file directly. It will be overwritten by upgrades.
# Edit or add files under /usr/share/ovirt-engine/etc/ovirt-engine/ovirt-websocket-proxy.conf.d instead. See the file
# README there for details.
#
# Package information
#
PACKAGE_NAME="ovirt-engine"
PACKAGE_VERSION="4.5.6"
PACKAGE_DISPLAY_VERSION="4.5.6"

#
# This is a default configuration file for oVirt/RHEV-M websockets proxy
#
PROXY_HOST=*
PROXY_PORT=6100
SOURCE_IS_IPV6=False
SSL_CERTIFICATE=
SSL_KEY=
# Available values for SSL_MIN_VERSION:
# TLSv1.2, TLSv1.3
SSL_MIN_VERSION="TLSv1.2"
CERT_FOR_DATA_VERIFICATION=
SSL_ONLY=False
TRACE_ENABLE=False
TRACE_FILE=
ENGINE_USR="/usr/share/ovirt-engine/share/ovirt-engine"

# SSL_CIPHERS contain a list of ciphers allowed for connection.
# For a list of supported ciphers run `openssl ciphers`
SSL_CIPHERS="HIGH:!aNULL"
